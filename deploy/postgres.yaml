apiVersion: v1
kind: Secret
metadata:
  name: accounts-postgres
type: Opaque
stringData:
  database-user: postgres
  database-password: postgres
  database-name: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts-postgres
  template:
    metadata:
      labels:
        app: accounts-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: accounts-postgres
                  key: database-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-postgres
                  key: database-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: accounts-postgres
                  key: database-name
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-postgres
spec:
  selector:
    app: accounts-postgres
  ports:
    - port: 5432
      targetPort: 5432
